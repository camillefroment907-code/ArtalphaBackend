<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy background with rounded corners -->
  <rect width="32" height="32" rx="7" fill="#0A1628"/>

  <!-- Nautilus spiral — white outer arcs -->
  <path d="M 16 3 A 13 13 0 0 1 29 16" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 29 16 A 13 13 0 0 1 16 29" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.55"/>

  <!-- Gold inner arcs -->
  <path d="M 16 29 A 6.5 6.5 0 0 1 9.5 22.5" stroke="#C6A85A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 9.5 22.5 A 6.5 6.5 0 0 1 16 16" stroke="#C6A85A" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.8" fill="#C6A85A"/>
</svg>
