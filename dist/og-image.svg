<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Navy background -->
  <rect width="1200" height="630" fill="#1A2A44"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="rgba(198,168,90,0.06)" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="rgba(198,168,90,0.06)" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="rgba(198,168,90,0.06)" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="rgba(198,168,90,0.06)" stroke-width="1"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="#C6A85A"/>

  <!-- Shell / spiral decorative shape — bottom right -->
  <g transform="translate(980, 440)" opacity="0.12">
    <path d="M 110 110 A 100 100 0 0 0 10 10" stroke="#C6A85A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 110 110 A 80 80 0 0 0 30 30" stroke="#C6A85A" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 110 110 A 60 60 0 0 0 50 50" stroke="#C6A85A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 110 110 A 40 40 0 0 0 70 70" stroke="#C6A85A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M 110 110 A 20 20 0 0 0 90 90" stroke="#C6A85A" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Logo symbol (simplified shell arc) -->
  <g transform="translate(560, 140)">
    <path d="M 40 8 A 32 32 0 0 1 72 40" stroke="#C6A85A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 72 40 A 32 32 0 0 1 40 72" stroke="#C6A85A" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 40 72 A 16 16 0 0 1 24 56" stroke="#C6A85A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="40" r="4" fill="#C6A85A"/>
  </g>

  <!-- NAUTILUS wordmark -->
  <text
    x="600"
    y="310"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="96"
    font-weight="700"
    letter-spacing="18"
    fill="#C6A85A"
    text-anchor="middle"
    dominant-baseline="middle"
  >NAUTILUS</text>

  <!-- Tagline -->
  <text
    x="600"
    y="390"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    font-weight="400"
    letter-spacing="4"
    fill="rgba(198,168,90,0.65)"
    text-anchor="middle"
    dominant-baseline="middle"
  >Art Market Intelligence</text>

  <!-- Gold separator -->
  <rect x="520" y="425" width="160" height="1" fill="rgba(198,168,90,0.35)"/>

  <!-- URL -->
  <text
    x="600"
    y="460"
    font-family="'Courier New', monospace"
    font-size="18"
    letter-spacing="2"
    fill="rgba(255,255,255,0.35)"
    text-anchor="middle"
    dominant-baseline="middle"
  >get-nautilus.com</text>
</svg>
